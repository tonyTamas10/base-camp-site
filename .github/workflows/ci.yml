name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A throwaway database, built from migrations like production (ADR 0011).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: basecamp
          POSTGRES_PASSWORD: basecamp
          POSTGRES_DB: basecamp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U basecamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://basecamp:basecamp@localhost:5432/basecamp_test
      PAYLOAD_SECRET: ci-only-secret
      SITE_URL: http://localhost:3000
      # Pins "today" so event statuses match the test data.
      SITE_TODAY: '2026-09-24'
      # Test-only admin for the publishing test; exists only in this throwaway database.
      SEED_ADMIN_EMAIL: admin@basecamp.test
      SEED_ADMIN_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Apply migrations and seed sample content
        run: |
          pnpm migrate
          pnpm seed

      # Fails if the collections changed without a migration (run `pnpm migrate:create <name>`).
      - name: Check migrations match the schema
        run: |
          pnpm payload migrate:create schema-drift --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::The CMS schema changed but no migration was committed. Run: pnpm migrate:create <name>"
            git status --porcelain src/migrations
            exit 1
          fi

      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
